<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glint 本地动效编辑</title>
<style>
:root{color-scheme:dark;--bg:#10171c;--panel:#19232a;--line:#34434a;--text:#e7eeef;--muted:#a7b7bb;--accent:#56c8c1;--danger:#ff9c9c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px}h1{font-size:24px;margin:4px 0}h2{font-size:16px;margin:0 0 14px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.12em}.muted{color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:12px 16px;background:var(--panel);margin:20px 0}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}.layers{display:grid;gap:8px}.layer{text-align:left;overflow-wrap:anywhere}.layer[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}button,input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:9px;min-width:0}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:5px;color:var(--muted);font-size:13px}input,select{width:100%}.wide{grid-column:1/-1}.actions{display:flex;gap:12px;align-items:end;margin-top:20px}.actions label{flex:1}.primary{background:var(--accent);color:var(--bg);font-weight:700;border-color:var(--accent)}#status{min-height:24px;overflow-wrap:anywhere}#status.error{color:var(--danger)}.meta{font-variant-numeric:tabular-nums}.hint{font-size:13px;color:var(--muted)}@media(max-width:700px){main{padding:20px 16px}.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.wide{grid-column:auto}.actions{align-items:stretch;flex-direction:column}}
</style></head><body><main>
<div class="eyebrow">GLINT / LOCAL MOTION</div><h1>本地动效参数编辑</h1><p class="muted">选择顶层图层，填写需要修改的属性，保存为新工程。</p>
<div class="notice">此页面只读取参数，不播放或执行动画。仅支持受限 Lottie 子集；不支持完整 Lottie 或预合成编辑。导入内容仅可在可信的本机环境中渲染，Web 服务仍拒绝 HTML / Three 场景。</div>
<p id="meta" class="meta muted">正在读取工程…</p><div class="grid"><section class="panel"><h2>顶层图层</h2><div id="layers" class="layers"></div></section><section class="panel"><h2>编辑参数</h2><p id="selected" class="hint">请选择图层；整体参数无需选择图层。</p><form id="form"><div class="controls">
<label>整体速度（0.25–4）<input name="speed" type="number" min="0.25" max="4" step="any" placeholder="保持原值"></label><label>整体缩放（0.25–4）<input name="scale" type="number" min="0.25" max="4" step="any" placeholder="保持原值"></label><label>整体透明度（0–1）<input name="opacity" type="number" min="0" max="1" step="any" placeholder="保持原值"></label>
<label>图层透明度（0–100）<input name="layer-opacity" type="number" min="0" max="100" step="any" data-layer placeholder="保持原值"></label><label>图层锚点（x,y）<input name="layer-anchor" data-layer placeholder="例如 0,0"></label><label>图层位置（x,y）<input name="layer-pos" data-layer placeholder="例如 200,300"></label><label>图层缩放（x,y，%）<input name="layer-scale" data-layer placeholder="例如 100,100"></label><label>图层旋转（角度）<input name="layer-rotation" type="number" step="any" data-layer placeholder="保持原值"></label><label class="wide">静态文字<input name="layer-text" data-layer placeholder="保持原值；勾选可设为空"></label><label class="wide"><span><input id="empty-text" type="checkbox" style="width:auto"> 将静态文字设为空</span></label>
<label>填充路径<select name="fill-path" data-layer><option value="">不修改</option></select></label><label>填充颜色（#RRGGBB）<input name="fill-color" data-layer placeholder="#FF0000"></label><label>描边路径<select name="stroke-path" data-layer><option value="">不修改</option></select></label><label>描边颜色（#RRGGBB）<input name="stroke-color" data-layer placeholder="#FF0000"></label><label>透明度关键帧<select name="opacity-keyframe" data-layer><option value="">不修改</option></select></label><label>关键帧透明度（0–100）<input name="keyframe-opacity" type="number" min="0" max="100" step="any" data-layer placeholder="保持原值"></label><label>关键帧时间（帧）<input name="keyframe-frame" type="number" step="any" data-layer placeholder="保持原值"></label><label>位置关键帧<select name="position-keyframe" data-layer><option value="">不修改</option></select></label><label>关键帧位置（x,y）<input name="keyframe-pos" data-layer placeholder="例如 300,250"></label>
</div><p class="hint">只列出可编辑的静态颜色、已有透明度关键帧值/时间与位置关键帧值。未支持的结构或动画属性会被拒绝，不会覆盖原动画。</p><div class="actions"><label>新工程文件名<input name="output" required value="motion-edited.json" maxlength="125"></label><button class="primary" type="submit">保存新工程</button></div><p id="status" role="status" aria-live="polite"></p></form></section></div></main>
<script>
(()=>{const token=location.hash.slice(1)||sessionStorage.getItem('glint-motion-token')||'';if(location.hash){sessionStorage.setItem('glint-motion-token',token);history.replaceState(null,'',location.pathname)}const form=document.querySelector('#form'),status=document.querySelector('#status'),layers=document.querySelector('#layers'),selected=document.querySelector('#selected'),meta=document.querySelector('#meta');let state,layer;
const feedback=(s,error=false)=>{status.textContent=s;status.className=error?'error':''};const request=async(url,opts={})=>{const response=await fetch(url,{...opts,headers:{'x-glint-token':token,...opts.headers}});const result=await response.json();if(!response.ok)throw Error(result.error||'操作失败');return result};
const field=n=>form.elements.namedItem(n);const fillSelect=(name,items,label)=>{const el=field(name);el.replaceChildren(new Option('不修改',''));for(const item of items||[]){if(item.editable===false)continue;el.add(new Option(label(item),String(item.path??item.index)))}};
function choose(item){if(layer && layer.index===item.index)return;if(layer && (Array.from(form.querySelectorAll('[data-layer]')).some(el=>el.value!=='') || document.querySelector('#empty-text').checked) && !confirm('切换图层会丢弃当前图层尚未保存的修改，是否继续？'))return;layer=item;for(const el of form.querySelectorAll('[data-layer]')){el.disabled=false;if(el.tagName==='INPUT')el.value=''}document.querySelector('#empty-text').checked=false;fillSelect('fill-path',item.fills,x=>'路径 '+x.path);fillSelect('stroke-path',item.strokes,x=>'路径 '+x.path);fillSelect('opacity-keyframe',item.opacityKeyframes,x=>`帧 ${x.frame} · 不透明度 ${x.value}`);fillSelect('position-keyframe',item.positionKeyframes,x=>`帧 ${x.frame} · 位置 ${x.value}`);const supported={'layer-opacity':item.editableOpacity,'layer-anchor':typeof item.anchor==='string','layer-pos':typeof item.position==='string','layer-scale':typeof item.scale==='string','layer-rotation':typeof item.rotation==='number','layer-text':item.editableText,'fill-path':item.fills.some(x=>x.editable),'fill-color':item.fills.some(x=>x.editable),'stroke-path':item.strokes.some(x=>x.editable),'stroke-color':item.strokes.some(x=>x.editable),'opacity-keyframe':!!item.opacityKeyframes?.length,'keyframe-opacity':!!item.opacityKeyframes?.length,'keyframe-frame':!!item.opacityKeyframes?.length,'position-keyframe':!!item.positionKeyframes?.length,'keyframe-pos':!!item.positionKeyframes?.length};for(const [name,enabled] of Object.entries(supported)){const el=field(name);el.disabled=!enabled;el.title=enabled?'':'该图层没有可编辑的对应属性';}const empty=document.querySelector('#empty-text');empty.disabled=!item.editableText;empty.title=empty.disabled?'该图层没有可编辑的静态文字':'';selected.textContent=`图层 ${item.index} · ${item.name||'未命名'} | 锚点 ${item.anchor??'不可编辑'} | 位置 ${item.position??'不可编辑'} | 缩放 ${item.scale??'不可编辑'} | 旋转 ${item.rotation??'不可编辑'} | 透明度 ${item.opacity??'不可编辑'}`;for(const button of layers.children)button.setAttribute('aria-pressed',String(Number(button.dataset.index)===item.index));feedback('');}
for(const el of form.querySelectorAll('[data-layer]'))el.disabled=true;document.querySelector('#empty-text').disabled=true;
request('/api/state').then(data=>{state=data;meta.textContent=`${data.mode==='import'?'导入新镜头':'编辑已导入镜头'} · ${data.scene} · ${data.width} × ${data.height} · ${data.sourceFr} fps · ${data.layers.length} 个顶层图层`;for(const item of data.layers){const b=document.createElement('button');b.type='button';b.className='layer';b.dataset.index=item.index;b.setAttribute('aria-pressed','false');b.textContent=`${item.index}  ${item.name||'未命名图层'}`;b.addEventListener('click',()=>choose(item));layers.append(b)}}).catch(e=>{meta.textContent='读取失败';feedback(e.message,true)});
form.addEventListener('submit',async event=>{event.preventDefault();if(!state)return;const edits={};for(const name of ['speed','scale','opacity','layer-opacity','layer-anchor','layer-pos','layer-scale','layer-rotation','layer-text','fill-path','fill-color','stroke-path','stroke-color','opacity-keyframe','keyframe-opacity','keyframe-frame','position-keyframe','keyframe-pos']){const v=field(name).value;if(v!=='')edits[name]=v}if(document.querySelector('#empty-text').checked)edits['layer-text']='';if(Object.keys(edits).some(k=>k.startsWith('layer-')||k.startsWith('fill-')||k.startsWith('stroke-')||k.includes('keyframe'))) {if(!layer){feedback('请先选择图层。',true);return}edits['layer-index']=String(layer.index)}const button=form.querySelector('button[type=submit]');button.disabled=true;feedback('正在保存…');try{const result=await request('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({output:field('output').value,edits,revision:state.revision})});feedback(`已保存 ${result.output}。原工程未修改；请使用本机 glint render 渲染。`)}catch(e){feedback(e.message,true)}finally{button.disabled=false}});
})();
</script></body></html>
