name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ffmpeg powers the build/receipt/provenance tests; CJK fonts keep raster goldens meaningful.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pnpm verify:source
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 scripts/test-qwen-text.py
      - run: pnpm eval:quality
      - run: pnpm --filter glint-web build
      - run: pnpm verify:budget

  windows:
    # The shipping target is Windows; this job proves the same unit suite and
    # typecheck there. Opt-in browser/4K/long render gates stay off.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: choco install ffmpeg -y --no-progress
      - run: pnpm typecheck
      - run: pnpm test

