name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare owner-approved locked goldens
        run: node scripts/prepare-ci-fixtures.mjs goldens
        env:
          GLINT_CI_GOLDENS_DIR: ${{ vars.GLINT_CI_GOLDENS_DIR }}
          GLINT_CI_GOLDENS_URLS: ${{ vars.GLINT_CI_GOLDENS_URLS }}
      # ffmpeg powers the build/receipt/provenance tests; CJK fonts keep raster goldens meaningful.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Prepare ten local style samples
        run: node scripts/prepare-ci-fixtures.mjs runtime
        env:
          GLINT_CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm verify:source
      - run: pnpm check:evidence
      - run: pnpm check:ui
      - run: pnpm check:tests
      - run: pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 scripts/test-qwen-text.py
      - run: pnpm eval:quality
      - run: pnpm --filter glint-web build
      - run: pnpm verify:budget

  windows:
    # The shipping target is Windows; this job proves the same unit suite and
    # typecheck there. Opt-in browser/4K/long render gates stay off.
    # GLINT_CI_SLOW scales the suite budgets (Q-06c), so the job window grew with it.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Hosted runners are 2-4x slower than a dev box and Defender scans freshly
      # copied executables; scale test budgets without relaxing any assertion.
      GLINT_CI_SLOW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare owner-approved locked goldens
        run: node scripts/prepare-ci-fixtures.mjs goldens
        env:
          GLINT_CI_GOLDENS_DIR: ${{ vars.GLINT_CI_GOLDENS_DIR }}
          GLINT_CI_GOLDENS_URLS: ${{ vars.GLINT_CI_GOLDENS_URLS }}
      - run: choco install ffmpeg -y --no-progress
      - name: Prepare explicit Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable fetch --locked --manifest-path apps/desktop/secure-assets/Cargo.toml
      - name: Prepare ten styles and both secure bridges
        run: node scripts/prepare-ci-fixtures.mjs runtime
        env:
          GLINT_CHROME_PATH: C:/Program Files/Google/Chrome/Application/chrome.exe
          RUSTUP_TOOLCHAIN: stable
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter glint-web build
      - run: cargo +stable check --locked --manifest-path apps/desktop/Cargo.toml
      - run: cargo +stable clippy --locked --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings
      - run: cargo +stable test --locked --manifest-path apps/desktop/Cargo.toml

  browser-core:
    # Local fixtures only: no provider credentials, model calls or historical style videos.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GLINT_CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      # Hosted Ubuntu provides Chrome; fail explicitly if that image contract changes.
      - run: test -x "$GLINT_CHROME_PATH" && "$GLINT_CHROME_PATH" --version
      - run: pnpm --filter glint-web build
      - name: Run the core and design browser files without skips
        run: >-
          node scripts/verify-browser.mjs
          apps/web/server/creation-flow.browser.test.ts
          apps/web/server/storyboard.browser.test.ts
          apps/web/server/hybrid-creation.browser.test.ts
          apps/web/server/reference-adoption.browser.test.ts
          apps/web/server/design-editor-bridge.browser.test.ts
          apps/web/server/design-export.browser.test.ts
          apps/web/server/design-navigation.browser.test.ts
          apps/web/server/design-transition.browser.test.ts
          apps/web/server/design-mask.browser.test.ts
          apps/web/server/design-edit-16-20.browser.test.ts
          apps/web/server/design-signoff-6-8-27.browser.test.ts
          apps/web/server/container-graph.browser.test.ts
          apps/web/server/container-v2.browser.test.ts
          apps/web/server/project-git-workspace.browser.test.ts
          apps/desktop/scripts/legacy-origin-export.browser.test.ts

  code-quality:
    # Owner enables this only after reviewing and committing the bootstrap baseline.
    # Once enabled, missing/deleted baselines fail; they never skip this job.
    if: ${{ vars.GLINT_QUALITY_BOOTSTRAP_COMMIT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      QUALITY_BOOTSTRAP: ${{ vars.GLINT_QUALITY_BOOTSTRAP_COMMIT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate owner-approved baseline ancestry
        shell: bash
        run: |
          [[ "$QUALITY_BOOTSTRAP" =~ ^[a-f0-9]{40}$ ]] || exit 2
          [[ "$QUALITY_BASE" =~ ^[a-f0-9]{40}$ ]] || exit 2
          git merge-base --is-ancestor "$QUALITY_BOOTSTRAP" "$QUALITY_BASE"
          git cat-file -e "$QUALITY_BOOTSTRAP:scripts/code-quality-baseline.json"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
