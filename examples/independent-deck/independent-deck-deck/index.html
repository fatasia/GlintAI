</script><script>function deckRuntime() {
    const data = JSON.parse(document.getElementById("deck-data").textContent);
    const get = (id) => document.getElementById(id);
    const image = get("scene-image");
    const render = window.__glintRender;
    let animation = 0, imageUrl = "", lastPaintedFrame = -1;
    function paint(frame) {
        if (frame === lastPaintedFrame)
            return;
        lastPaintedFrame = frame;
        if (imageUrl)
            URL.revokeObjectURL(imageUrl);
        const scene = data.scenes[page];
        const svg = render(data.project, scene.scene, frame, { plate: true, previousScene: scene.previousScene });
        imageUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
        image.src = imageUrl;
    }
    function animate() {
        cancelAnimationFrame(animation);
        const scene = data.scenes[page], fps = data.project.fps ?? 30;
        const frames = Math.max(1, Math.round((scene.narration.durationMs ?? 6000) / 1000 * fps));
        const token = generation, start = performance.now();
        const tick = () => {
            if (token !== generation)
                return;
            const seconds = scene.audio ? audio.currentTime : (performance.now() - start) / 1000;
            const frame = Math.min(frames - 1, Math.floor(seconds * fps));
            paint(frame);
            if (frame < frames - 1 && (!scene.audio || !audio.paused))
                animation = requestAnimationFrame(tick);
        };
        if (matchMedia("(prefers-reduced-motion: reduce)").matches)
            paint(frames - 1);
        else
            animation = requestAnimationFrame(tick);
    }
    const audio = get("voice");
    const select = get("outline");
    const storageKey = `glint-deck-${data.digest}`;
    const channel = typeof BroadcastChannel === "function" ? new BroadcastChannel(storageKey) : undefined;
    const sender = crypto.randomUUID();
    let applyingRemote = false;
    channel?.addEventListener("message", event => {
        const message = event.data;
        if (!message || message.sender === sender || message.type !== "page" || !Number.isInteger(message.page) || message.page < 0 || message.page >= data.scenes.length)
            return;
        applyingRemote = true;
        try {
            show(message.page);
        }
        finally {
            applyingRemote = false;
        }
    });
    let page = 0, answers = {}, playing = false, generation = 0;
    let elapsed = 0, startedAt = performance.now();
    try {
        const saved = JSON.parse(localStorage.getItem(storageKey) ?? "{}");
        if (Number.isInteger(saved.page))
            page = Math.max(0, Math.min(data.scenes.length - 1, saved.page));
        if (saved.answers && typeof saved.answers === "object") {
            data.scenes.forEach((scene) => { const a = saved.answers[scene.id]; if (scene.quiz && Number.isInteger(a) && a >= 0 && a < scene.quiz.options.length)
                answers[scene.id] = a; });
        }
    }
    catch { /* Private mode and file:// may deny storage; presentation still works. */ }
    const save = () => { try {
        localStorage.setItem(storageKey, JSON.stringify({ page, answers }));
    }
    catch {
        get("status").textContent = "浏览器不允许保存，本次仍可正常演示。";
    } };
    const say = (text) => { get("status").textContent = text; };
    data.scenes.forEach((scene, i) => { const option = document.createElement("option"); option.value = String(i); option.textContent = `${i + 1}. ${scene.label}`; select.append(option); });
    function showResult() {
        const scene = data.scenes[page], answer = answers[scene.id];
        get("result").textContent = answer === undefined ? "选择一个答案，检查这一页是否讲清楚。" : `${answer === scene.quiz?.answerIndex ? "回答正确。" : "再想一想。"} ${scene.quiz?.explanation ?? ""}`;
        get("answers").querySelectorAll("button").forEach((button, i) => { button.setAttribute("aria-pressed", String(answer === i)); });
    }
    async function playVoice() {
        if (!data.scenes[page].audio) {
            say("本页没有配音文件；可手动翻页，或先生成配音后重新导出。");
            return;
        }
        const token = generation;
        try {
            await audio.play();
            if (token !== generation)
                return;
            playing = true;
            animate();
            get("play").textContent = "暂停旁白";
            say("正在播放本页旁白");
        }
        catch {
            if (token === generation) {
                playing = false;
                get("play").textContent = "播放旁白";
                say("浏览器阻止了自动播放，请点击“播放旁白”。");
            }
        }
    }
    function show(index, autoplay = false) {
        generation++;
        cancelAnimationFrame(animation);
        lastPaintedFrame = -1;
        playing = false;
        audio.pause();
        audio.removeAttribute("src");
        page = Math.max(0, Math.min(data.scenes.length - 1, index));
        const scene = data.scenes[page];
        image.src = scene.image;
        image.alt = scene.label;
        select.value = String(page);
        get("count").textContent = `${page + 1} / ${data.scenes.length}`;
        get("previous").disabled = page === 0;
        get("next").disabled = page === data.scenes.length - 1;
        get("progress").style.width = `${(page + 1) / data.scenes.length * 100}%`;
        get("play").textContent = "播放旁白";
        get("caption").textContent = scene.narration.text;
        if (scene.audio) {
            audio.src = scene.audio;
            audio.load();
            say("旁白已就绪，点击播放。");
        }
        else
            say("本页为无声演示，可用方向键翻页。");
        get("notes").textContent = scene.notes || "本页没有演讲备注。";
        const next = data.scenes[page + 1];
        get("next-image").src = next?.image ?? scene.image;
        get("next-label").textContent = next ? `下一页：${next.label}` : "已到最后一页";
        get("quiz").hidden = !scene.quiz;
        get("answers").replaceChildren();
        if (scene.quiz) {
            get("question").textContent = scene.quiz.question;
            scene.quiz.options.forEach((text, i) => { const button = document.createElement("button"); button.textContent = text; button.onclick = () => { answers[scene.id] = i; save(); showResult(); }; get("answers").append(button); });
            showResult();
        }
        save();
        animate();
        if (!applyingRemote)
            channel?.postMessage({ type: "page", page, sender });
        if (autoplay)
            void playVoice();
    }
    get("previous").onclick = () => show(page - 1, playing);
    get("next").onclick = () => show(page + 1, playing);
    select.onchange = () => show(Number(select.value));
    get("play").onclick = () => { if (playing) {
        generation++;
        audio.pause();
        playing = false;
        get("play").textContent = "继续旁白";
        say("已暂停");
    }
    else
        void playVoice(); };
    get("presenter-toggle").onclick = () => { get("presenter").hidden = !get("presenter").hidden; get("presenter-toggle").setAttribute("aria-expanded", String(!get("presenter").hidden)); };
    get("presenter-window").onclick = () => {
        const url = new URL(location.href);
        url.searchParams.set("presenter", "1");
        const popup = window.open(url.href, `glint-presenter-${data.digest}`, "width=1280,height=900");
        if (!popup)
            say("浏览器阻止了新窗口；请允许弹窗，或使用同页演讲者视图。");
    };
    get("reset").onclick = () => { answers = {}; save(); show(page); say("已清空本演示的答题记录。"); };
    get("fullscreen").onclick = async () => { try {
        if (document.fullscreenElement)
            await document.exitFullscreen();
        else
            await document.documentElement.requestFullscreen();
    }
    catch {
        say("当前浏览器不允许全屏，请使用浏览器全屏快捷键。");
    } };
    document.addEventListener("keydown", event => {
        if (event.target instanceof HTMLElement && /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(event.target.tagName))
            return;
        if (event.key === "ArrowRight" || event.key === " ") {
            event.preventDefault();
            show(page + 1, playing);
        }
        if (event.key === "ArrowLeft") {
            event.preventDefault();
            show(page - 1, playing);
        }
        if (event.key === "Home")
            show(0);
        if (event.key === "End")
            show(data.scenes.length - 1);
        if (event.key === "Escape")
            get("presenter").hidden = true;
    });
    audio.onended = () => { playing = false; get("play").textContent = "重新播放"; say("本页旁白播放完毕。请翻到下一页。"); };
    audio.onerror = () => { playing = false; get("play").textContent = "重试旁白"; say("旁白读取失败，请确认导出目录中的音频文件完整。"); };
    image.onerror = () => say("画面读取失败，请确认导出目录完整。");
    audio.ontimeupdate = () => {
        const words = data.scenes[page].narration.segments?.flatMap((segment) => segment.words ?? []) ?? [];
        if (!words.length)
            return;
        const now = audio.currentTime * 1000, current = words.findIndex((word) => now >= word.startMs && now < word.endMs);
        const start = Math.max(0, Math.floor(Math.max(0, current) / 24) * 24);
        get("caption").replaceChildren();
        words.slice(start, start + 24).forEach((word, i) => { const node = document.createElement(start + i === current ? "mark" : "span"); node.textContent = word.text; get("caption").append(node); });
    };
    setInterval(() => { elapsed += performance.now() - startedAt; startedAt = performance.now(); const seconds = Math.floor(elapsed / 1000); get("clock").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`; }, 1000);
    show(page);
    if (new URL(location.href).searchParams.get("presenter") === "1") {
        get("presenter").hidden = false;
        get("presenter-toggle").setAttribute("aria-expanded", "true");
    }
    window.addEventListener("beforeunload", () => { channel?.close(); cancelAnimationFrame(animation); if (imageUrl)
        URL.revokeObjectURL(imageUrl); });
}

deckRuntime();</script></body></html>
